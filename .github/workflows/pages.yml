# Déploiement du site de doctrine (apps/site) sur GitHub Pages.
# Se déclenche à chaque push sur main. Le build tourne chez GitHub —
# c'est aussi notre seul environnement capable de faire un `next build` complet.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Injecte automatiquement basePath: "/sibyl-ds" dans next.config.mjs
      # (le site sera servi sous https://<user>.github.io/sibyl-ds/)
      # et active Pages sur le dépôt au premier passage.
      - uses: actions/configure-pages@v5
        with:
          static_site_generator: next
          generator_config_file: apps/site/next.config.mjs
          enablement: true

      - run: npm ci

      # Régénère les tokens + garde de fidélité DS-MD + contrôle de contraste.
      - run: npm run tokens:build

      - run: npm run build --workspace @sibyl/site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
